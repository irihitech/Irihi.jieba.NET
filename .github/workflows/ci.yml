name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        run: dotnet build jieba.NET.slnx -c Release

      - name: Test
        run: dotnet test jieba.NET.slnx -c Release --no-build

      - name: Pack (validate package)
        run: dotnet pack src/Segmenter/Segmenter.csproj -c Release --no-build -o artifacts
